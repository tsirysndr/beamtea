name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Linux: use the official erlef/setup-beam action across a few OTP versions.
  linux:
    name: test (ubuntu, OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        otp: ['28', '29']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Erlang/OTP + rebar3
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: '3'

      - name: Cache _build
        uses: actions/cache@v4
        with:
          path: _build
          key: ${{ runner.os }}-otp${{ matrix.otp }}-${{ hashFiles('rebar.config', 'rebar.lock') }}
          restore-keys: |
            ${{ runner.os }}-otp${{ matrix.otp }}-

      - run: rebar3 compile
      - run: rebar3 xref
      - run: rebar3 eunit
      - name: Compile examples
        run: rebar3 as examples compile

  # macOS: install Erlang + rebar3 via Homebrew.
  macos:
    name: test (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Erlang + rebar3
        run: brew install erlang rebar3

      - run: rebar3 compile
      - run: rebar3 xref
      - run: rebar3 eunit
      - name: Compile examples
        run: rebar3 as examples compile
